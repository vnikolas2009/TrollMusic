name: Merge Branches into Main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-branches-to-main
  cancel-in-progress: false

jobs:
  merge:
    name: Merge branches into main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin --prune

      - name: Create backup of main
        run: |
          BACKUP="backup/main-before-merge-${GITHUB_RUN_ID}"
          git branch "$BACKUP" origin/main
          git push origin "$BACKUP"
          echo "Backup created: $BACKUP"

      - name: Merge available branches
        shell: bash
        run: |
          set -euo pipefail

          git checkout main
          git reset --hard origin/main

          BRANCHES=(
            "feat/sources-yandex-vk-audius-player"
            "feat/spotify-first"
            "refactor/streaming-theme-music-home"
            "releases"
          )

          for BRANCH in "${BRANCHES[@]}"; do
            echo ""
            echo "======================================"
            echo "Checking branch: $BRANCH"
            echo "======================================"

            if ! git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              echo "Branch does not exist. Skipping."
              continue
            fi

            if ! git merge-base HEAD "origin/$BRANCH" >/dev/null 2>&1; then
              echo "No common history. Skipping."
              continue
            fi

            AHEAD=$(git rev-list --count "HEAD..origin/$BRANCH")

            if [ "$AHEAD" -eq 0 ]; then
              echo "No new commits. Skipping."
              continue
            fi

            echo "New commits to merge: $AHEAD"

            if ! git merge --no-ff --no-edit "origin/$BRANCH"; then
              echo "::error::Merge conflict in branch $BRANCH"
              git merge --abort || true
              exit 1
            fi

            echo "Successfully merged: $BRANCH"
          done

      - name: Push merged main
        run: |
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "All compatible branches processed."
          echo "Main has been updated."
