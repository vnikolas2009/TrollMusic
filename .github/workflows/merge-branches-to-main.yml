name: Merge Sources Branch into Main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-sources-into-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  merge-and-validate:
    name: Merge source integrations and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source branch
        run: |
          git fetch origin main feat/sources-yandex-vk-audius-player

      - name: Create backup
        run: |
          BACKUP="backup/main-before-sources-merge-${GITHUB_RUN_ID}"
          git branch "$BACKUP" origin/main
          git push origin "$BACKUP"
          echo "Backup: $BACKUP"

      - name: Merge source integrations
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git merge --no-ff --no-edit -X ours origin/feat/sources-yandex-vk-audius-player

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android APK
        run: flutter build apk --release

      - name: Push validated merge to main
        run: |
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "Source branch merged into main."
          echo "Flutter analyze passed."
          echo "Android APK build passed."
          echo "Validated merge pushed to main."
