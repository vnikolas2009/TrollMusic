name: Build Release

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: TrollMusic
  FLUTTER_VERSION: 3.50.1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}

    steps:
      - id: v
        run: |
          VERSION_NAME="1.0.$(( ${{ github.run_number }} - 1 ))"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME+${{ github.run_number }}"

  android:
    name: Android APK
    needs: [version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          set -euo pipefail

          SDKMAN="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"

          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true

          "$SDKMAN" "platform-tools" "platforms;android-37.0" \
            "build-tools;37.0.0" > /dev/null 2>&1 || true

          "$SDKMAN" "ndk;28.2.13676358" > /dev/null 2>&1 || true

          "$SDKMAN" --list_installed | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set version
        run: |
          set -euo pipefail

          sed -i -E "s/^version: .*/version: ${{ needs.version.outputs.name }}+${{ needs.version.outputs.code }}/" pubspec.yaml

          grep '^version:' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -euo pipefail

          flutter build apk --release \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}

      - name: Rename artifact
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK_PATH"

          mkdir -p dist

          cp "$APK_PATH" \
            "dist/${{ env.APP_NAME }}-v${{ needs.version.outputs.name }}-android.apk"

          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: [version]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set version
        run: |
          set -euo pipefail

          sed -i '' -E "s/^version: .*/version: ${{ needs.version.outputs.name }}+${{ needs.version.outputs.code }}/" pubspec.yaml

          grep '^version:' pubspec.yaml

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: |
          set -euo pipefail

          flutter build ios --release --no-codesign \
            --build-name=${{ needs.version.outputs.name }} \
            --build-number=${{ needs.version.outputs.code }}

          APP_PATH="build/ios/iphoneos/Runner.app"

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Runner"

          echo "iOS application built successfully."

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          IPA_PATH="$GITHUB_WORKSPACE/dist/${{ env.APP_NAME }}-v${{ needs.version.outputs.name }}-ios.ipa"

          echo "Checking application..."

          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Runner"

          plutil -lint "$APP_PATH/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")

          if [ "$EXECUTABLE" != "Runner" ]; then
            echo "Unexpected executable: $EXECUTABLE"
            exit 1
          fi

          echo "Checking Flutter frameworks..."

          if [ ! -d "$APP_PATH/Frameworks" ]; then
            echo "Frameworks directory is missing."
            exit 1
          fi

          rm -rf "$PACKAGE_DIR"
          rm -rf "$GITHUB_WORKSPACE/dist"

          mkdir -p "$PACKAGE_DIR/Payload"
          mkdir -p "$GITHUB_WORKSPACE/dist"

          echo "Copying Runner.app..."

          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          echo "Creating IPA..."

          cd "$PACKAGE_DIR"

          /usr/bin/ditto -c -k --norsrc --keepParent \
            Payload "$IPA_PATH"

          test -s "$IPA_PATH"

          echo "Validating IPA archive..."

          unzip -t "$IPA_PATH"

          unzip -Z1 "$IPA_PATH" > "$RUNNER_TEMP/ipa_contents.txt"

          grep -q '^Payload/Runner.app/Info.plist$' \
            "$RUNNER_TEMP/ipa_contents.txt"

          grep -q '^Payload/Runner.app/Runner$' \
            "$RUNNER_TEMP/ipa_contents.txt"

          grep -q '^Payload/Runner.app/Frameworks/' \
            "$RUNNER_TEMP/ipa_contents.txt"

          echo "IPA structure:"
          unzip -Z1 "$IPA_PATH" | head -40

          echo "IPA successfully packaged."

          ls -lh "$IPA_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, android, ios]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check artifacts
        run: |
          set -euo pipefail

          echo "Release files:"
          ls -lh dist/

          APK=$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)
          IPA=$(find dist -maxdepth 1 -type f -name '*.ipa' -print -quit)

          test -n "$APK"
          test -n "$IPA"

          test -s "$APK"
          test -s "$IPA"

          echo "Checking IPA archive..."

          unzip -t "$IPA"

          unzip -Z1 "$IPA" > ipa_contents.txt

          grep -q '^Payload/Runner.app/Info.plist$' ipa_contents.txt
          grep -q '^Payload/Runner.app/Runner$' ipa_contents.txt

          echo "All artifacts passed validation."

      - name: Push to releases branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"

          rm -rf releases-repo

          git init -q releases-repo

          cd releases-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git fetch --depth=1 origin releases; then
            git checkout -q -B releases FETCH_HEAD

            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout -q --orphan releases
          fi

          cp "$GITHUB_WORKSPACE"/dist/* .

          echo "${{ needs.version.outputs.name }}+${{ needs.version.outputs.code }}" > latest-version.txt

          git add -A

          git commit -q -m "release ${{ needs.version.outputs.tag }}"

          git push -q --force origin releases

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ needs.version.outputs.name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.ipa
          fail_on_unmatched_files: true
