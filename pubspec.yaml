name: ysplayer
description: YSPlayer — кроссплатформенный музыкальный плеер с офлайн-режимом.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.21
  just_audio_background: ^0.0.1-beta.13

  dio: ^5.8.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  file_picker: ^8.2.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0

  palette_generator: ^0.3.3+6
  audio_metadata_reader: ^1.4.2

  flutter_riverpod: ^2.6.1
  uuid: ^4.5.1
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
