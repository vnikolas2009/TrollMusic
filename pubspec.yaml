name: trollmusic
description: "TrollMusic - local music player with synced and word-by-word lyrics."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  dio: ^5.11.1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  file_picker: ^13.4.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  path: ^1.9.1

  palette_generator: ^0.3.3+7
  audio_metadata_reader: ^1.8.1

  flutter_riverpod: ^3.5.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-Manrope.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Inter-w0
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-400.ttf
          weight: 500
        - asset: assets/fonts/Inter-500.ttf
          weight: 600
        - asset: assets/fonts/Inter-600.ttf
          weight: 700
        - asset: assets/fonts/Inter-700.ttf
          weight: 800
    - family: Inter-w2
      fonts:
        - asset: assets/fonts/Inter-500.ttf
          weight: 400
        - asset: assets/fonts/Inter-600.ttf
          weight: 500
        - asset: assets/fonts/Inter-700.ttf
          weight: 600
        - asset: assets/fonts/Inter-800.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Inter-w3
      fonts:
        - asset: assets/fonts/Inter-600.ttf
          weight: 400
        - asset: assets/fonts/Inter-700.ttf
          weight: 500
        - asset: assets/fonts/Inter-800.ttf
          weight: 600
        - asset: assets/fonts/Inter-800.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Manrope-w0
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-400.ttf
          weight: 500
        - asset: assets/fonts/Manrope-500.ttf
          weight: 600
        - asset: assets/fonts/Manrope-600.ttf
          weight: 700
        - asset: assets/fonts/Manrope-700.ttf
          weight: 800
    - family: Manrope-w2
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 400
        - asset: assets/fonts/Manrope-600.ttf
          weight: 500
        - asset: assets/fonts/Manrope-700.ttf
          weight: 600
        - asset: assets/fonts/Manrope-800.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Manrope-w3
      fonts:
        - asset: assets/fonts/Manrope-600.ttf
          weight: 400
        - asset: assets/fonts/Manrope-700.ttf
          weight: 500
        - asset: assets/fonts/Manrope-800.ttf
          weight: 600
        - asset: assets/fonts/Manrope-800.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
