name: trollmusic
description: "TrollMusic - cross-platform music player with offline mode."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  dio: ^5.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  file_picker: ^13.4.0
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  path: ^1.9.1

  palette_generator: ^0.3.3+7
  audio_metadata_reader: ^1.8.1

  flutter_riverpod: ^3.5.0
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
